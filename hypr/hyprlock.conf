background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    color = rgb(22, 24, 29)
    blur_passes = 0
}

input-field {
    monitor = DP-3
    size = 200, 40
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(50, 53, 62)
    inner_color = rgb(28, 31, 38)
    font_color = rgb(180, 186, 199)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
}

label {
    monitor = DP-3
    text = $TIME
    color = rgb(204, 208, 217)
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
